[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    unit: tests unitaires rapides, pas d'I/O réseau
    integration: tests d'intégration avec Postgres réel
    e2e: tests end-to-end (peuvent toucher Claude API si AUTOHOTE_E2E_LIVE=1)
addopts = -ra --strict-markers -p no:cacheprovider
